name: Advertiser backend checks

on:
  push:
    branches:
      - planning/sponsored-advertising-2026-11-27
      - work/sponsored-ads-shared-supabase-2026-11-27
    paths:
      - "advertiser-backend/**"
      - "supabase/functions/**"
      - "docs/sponsored-advertising-*.md"
      - "advertiser-portal.*"
      - "advertiser-portal-config.js"
      - "advertiser-portal-refunds.js"
      - "advertiser-portal-design.js"
      - "advertiser-portal-changes.js"
      - "sponsored-*.js"
      - "match-performance-engine.js"
      - ".github/workflows/advertiser-backend-checks.yml"
  pull_request:
    paths:
      - "advertiser-backend/**"
      - "supabase/functions/**"
      - "docs/sponsored-advertising-*.md"
      - "advertiser-portal.*"
      - "advertiser-portal-config.js"
      - "advertiser-portal-changes.js"
      - ".github/workflows/advertiser-backend-checks.yml"

permissions:
  contents: read

concurrency:
  group: advertiser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advertising_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d advertising_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check advertiser portal JavaScript syntax
        run: |
          node --check advertiser-portal.js
          node --check advertiser-portal-changes.js
      - name: Check Discover integration JavaScript syntax
        run: |
          node --check sponsored-discover-integration.js
          node --check sponsored-advertising-config.js
          node --check match-performance-engine.js
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            # The hosted Ubuntu image may have a temporarily unavailable
            # Microsoft package feed; remove that unrelated feed before apt.
            sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Test shared-project advertiser claim isolation, RLS and campaign lifecycle
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/test-bootstrap.sql
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/bootstrap.sql
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/bootstrap.sql
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/campaign-change-requests.sql
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/campaign-change-requests.sql
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/verify.sql
          psql -h localhost -U postgres -d advertising_test -v ON_ERROR_STOP=1 -f advertiser-backend/database/test-workflows.sql
      - name: Check public config contains no server secrets
        run: |
          ! grep -Eiq 'service_role|secret_key|B2_APPLICATION_KEY|ADVERTISING_ACCOUNT_NUMBER' advertiser-portal-config.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check advertiser and guarded member Edge Functions
        run: |
          deno check advertiser-backend/supabase/functions/advertiser-register/index.ts
          deno check advertiser-backend/supabase/functions/advertising-api/index.ts
          deno check advertiser-backend/supabase/functions/advertising-media-upload/index.ts
          deno check advertiser-backend/supabase/functions/advertising-design-upload/index.ts
          deno check advertiser-backend/supabase/functions/member-ad-serving/index.ts
          deno check supabase/functions/nearby-reverse-geocode/index.ts
          deno check supabase/functions/b2-media-upload/index.ts
          deno check supabase/functions/b2-media-access/index.ts
          deno check supabase/functions/admin-moderate-member/index.ts
          deno check supabase/functions/open-view-once-chat-media/index.ts
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/b2-media-migrate/index.ts
          deno check supabase/functions/b2-storage-cleanup/index.ts
          deno check supabase/functions/b2-media/index.ts
