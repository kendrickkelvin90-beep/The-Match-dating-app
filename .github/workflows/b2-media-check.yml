name: B2 media migration checks

on:
  pull_request:
    paths:
      - "supabase/functions/b2-media-migrate/**"
      - "supabase/migrations/*automatic_b2_story_media_migration*"
      - "supabase/config.toml"
      - ".github/workflows/b2-media-check.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the scheduled B2 migration worker
        run: deno check supabase/functions/b2-media-migrate/index.ts
