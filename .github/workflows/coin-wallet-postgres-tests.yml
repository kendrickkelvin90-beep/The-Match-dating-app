name: Coin wallet PostgreSQL integration tests # includes virtual gift DM delivery, profile fixture and regression assertions

on:
  pull_request:
    branches:
      - main
    paths:
      - "coin-wallet.js"
      - "gifts.js"
      - "index.html"
      - "supabase/migrations/**"
      - "tests/coin-wallet/**"
      - ".github/workflows/coin-wallet-postgres-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: match_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d match_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/match_test
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: |
          node --check gifts.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.current = []
                  self.inline = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
                      self.current = []
                      self.external = any(k == "src" for k, _ in attrs)
              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      source = "".join(self.current)
                      if not self.external and source.strip():
                          self.inline.append(source)
                      self.active = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text())
          for number, source in enumerate(parser.inline):
              path = Path("/tmp") / f"match-inline-{number}.js"
              path.write_text(source)
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Checked gifts.js and {len(parser.inline)} inline script(s).")
          PY
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create disposable auth and app fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/setup.sql
      - name: Apply wallet foundation to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261104210236_coin_wallet_bank_transfer_foundation.sql
      - name: Apply gift migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261104225000_virtual_gifts.sql
      - name: Apply gift recipient notification migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107090000_notify_members_of_received_gifts.sql
      - name: Apply virtual gift DM delivery migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107095000_deliver_virtual_gifts_in_dm.sql
      - name: Apply wallet hardening migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261104231000_harden_coin_idempotency_and_membership_locks.sql
      - name: Apply individual coin store purchase migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261105090000_individual_coin_store_purchases.sql
      - name: Apply profile badge activation migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261105110000_activate_special_profile_badge.sql
      - name: Apply purchased profile boost migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261105143000_activate_purchased_profile_boosts.sql
      - name: Create Discover Super Like fixture tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/super-like-setup.sql
      - name: Apply Discover Super Like migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261105170000_discover_super_likes.sql
      - name: Apply Profile Boost first-message ticket migration to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261105180000_profile_boost_first_message_tickets.sql
      - name: Run wallet, membership, gifts, and admin assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/assertions.sql
      - name: Run gift recipient notification assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/gift-notification-assertions.sql
      - name: Run profile badge activation assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/profile-badge-assertions.sql
      - name: Run purchased profile boost assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/purchased-profile-boost-assertions.sql
      - name: Run Discover Super Like assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/super-like-assertions.sql
      - name: Run Profile Boost first-message assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/profile-boost-first-message-assertions.sql
      - name: Configure concurrency probes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/coin-wallet/concurrency-setup.sql
      - name: Run concurrent transaction tests
        run: bash tests/coin-wallet/concurrency.sh
