name: Member interests migration checks

on:
  pull_request:
    paths:
      - "supabase/migrations/20261116100000_member_interests_opt_in_foundation.sql"
      - "supabase/tests/member_interests_opt_in.sql"
      - ".github/workflows/member-interests-migration.yml"
  push:
    branches:
      - feat/member-interests-consent-foundation
    paths:
      - "supabase/migrations/20261116100000_member_interests_opt_in_foundation.sql"
      - "supabase/tests/member_interests_opt_in.sql"
      - ".github/workflows/member-interests-migration.yml"

permissions:
  contents: read

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: match_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d match_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare minimal Supabase-like test roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create schema private;
          create table auth.users (id uuid primary key);
          create function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          grant usage on schema auth to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL

      - name: Apply member interests migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116100000_member_interests_opt_in_foundation.sql

      - name: Verify consent, ownership, anonymous denial, and 20-interest cap
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_interests_opt_in.sql
