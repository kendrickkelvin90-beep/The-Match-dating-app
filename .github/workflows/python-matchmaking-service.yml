name: Python matchmaking service checks

on:
  push:
    paths:
      - "services/matchmaking-python/**"
      - ".github/workflows/python-matchmaking-service.yml"
  pull_request:
    paths:
      - "services/matchmaking-python/**"
      - ".github/workflows/python-matchmaking-service.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matchmaking-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/matchmaking-python/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
