permissions:
  contents: read

jobs:
  postgres-eligibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: match_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d match_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check secure View Once Edge Function
        run: deno check supabase/functions/open-view-once-chat-media/index.ts

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript blocks found")
          with tempfile.TemporaryDirectory() as directory:
              for number, script in enumerate(inline_scripts, start=1):
                  path = pathlib.Path(directory) / f"inline-{number}.js"
                  path.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Checked {len(inline_scripts)} inline JavaScript blocks")
          completeness = html.split("function profileDetailsAreComplete()", 1)[1].split("\n}", 1)[0]
          if "sexualRole" in completeness or "roles.length" in completeness:
              raise SystemExit("Frontend profile completeness must not require a sexual role")
          if "sexual_roles:" not in html or ": []" not in html:
              raise SystemExit("Profile save must support an empty sexual_roles array")
          print("Verified that sexual-role selection is optional in the frontend")
          if 'config: { private: true, broadcast: { self: false } }' not in html:
              raise SystemExit("Chat typing must use a private Realtime channel")
          if "handleChatTypingInput" not in html or "chatTypingStatus" not in html:
              raise SystemExit("Chat typing indicator UI or input handler is missing")
          print("Verified that chat typing uses a private Realtime channel")
          if 'get_dating_compatibility_scores' not in html or 'discover-compatibility-badge' not in html:
              raise SystemExit("Discover compatibility score integration is missing")
          print("Verified that Discover displays opt-in compatibility scores")
          if "shuffleDiscoverProfiles" not in html or "Math.log" not in html:
              raise SystemExit("Discover must use weighted random ordering influenced by compatibility and selected preference weights")
          if "education_level" not in html or "occupation" not in html:
              raise SystemExit("Lifestyle ranking must include consent-shared education and occupation matches")
          print("Verified weighted Discover ranking and shared profile-extra signals")
          if "reply_to_message_id" not in html or "toggle_chat_message_reaction" not in html:
              raise SystemExit("Chat replies and reactions are not connected to the UI")
          print("Verified chat reply and reaction UI integration")
          if 'id="datingPartnerPreferences"' not in html or 'partner_preferences:' not in html:
              raise SystemExit("Private reciprocal partner-preference controls are missing")
          for field in ("partnerSmoking", "partnerDrinking", "partnerActivity", "partnerPets", "partnerChildren", "partnerIntention"):
              if f'id="{field}"' not in html:
                  raise SystemExit(f"Missing partner-preference control: {field}")
          print("Verified private partner-preference controls and save wiring")
          if 'id="profilePauseToggle"' not in html or "loadProfilePauseSetting" not in html:
              raise SystemExit("Pause Profile settings toggle or state loader is missing")
          if "profile_paused: nextPaused" not in html or "profile_paused" not in html:
              raise SystemExit("Pause Profile state is not persisted")
          pause_migration = pathlib.Path("supabase/migrations/20261117190000_profile_pause_discovery_control.sql").read_text(encoding="utf-8")
          if "candidate.profile_paused = false" not in pause_migration:
              raise SystemExit("Server-side pause filter migration is missing")
          print("Verified Pause Profile UI and save wiring")
          if 'id="profilePronouns"' not in html or 'pronouns:$("profilePronouns").value' not in html:
              raise SystemExit("Optional pronouns control or profile save wiring is missing")
          if 'id="discoverVisibilitySelect"' not in html or "discover_visibility: nextValue" not in html:
              raise SystemExit("Discover visibility control or persistence is missing")
          visibility_migration = pathlib.Path("supabase/migrations/20261118130000_profile_discover_visibility_and_pronouns.sql").read_text(encoding="utf-8")
          if "candidate.discover_visibility" not in visibility_migration or "matches_only" not in visibility_migration:
              raise SystemExit("Server-side Discover visibility enforcement is missing")
          print("Verified pronouns and Discover visibility UI wiring")
          if 'key: "dating_community"' in html or 'id="datingCommunityRequiredNotice"' in html or '$("datingCommunity")' in html:
              raise SystemExit("The old manual dating-community selector must not return")
          if "deriveDatingLaneFromOrientation" not in html or 'key: "sexual_orientation"' not in html or "registration_answers:" not in html:
              raise SystemExit("Registration must collect and persist private sexual orientation before account creation")
          if 'id="sexualOrientation"' in html or '$("sexualOrientation")?.addEventListener' in html:
              raise SystemExit("Sexual orientation must not remain editable in profile settings")
          print("Verified registration-collected orientation, automatic lanes, and no editable profile orientation")
          if "function showMissingOrientationSetup()" not in html:
              raise SystemExit("Existing members missing a registration orientation need a one-time completion screen")
          if "currentMemberOrientationMissing = !savedOrientation" not in html:
              raise SystemExit("Missing orientation must be distinguished from an explicit undisclosed answer and legacy saved lane")
          if "Save privately and continue" not in html or "sexual_orientation: select.value" not in html:
              raise SystemExit("Private orientation completion must save the selected answer to member_onboarding")
          if "if (currentMemberOrientationMissing)" not in html:
              raise SystemExit("Session restoration must open the missing-orientation completion screen")
          print("Verified one-time private orientation recovery for existing accounts")
          if 'member_can_interact_with_discover_profile' not in html:
              raise SystemExit("Discover must check server-side interaction eligibility for each profile")
          if "This profile is view-only until its member completes orientation." not in html:
              raise SystemExit("Unassigned profiles need a clear view-only notice")
          if "if (!canInteractWithPerson) return;" not in html or 'continueButton.textContent = "Next profile"' not in html:
              raise SystemExit("Unassigned profiles must not support swipe actions and need safe next-profile navigation")
          if "if (canInteractWithPerson) {\n        actions.append(pass,superLike,like);" not in html:
              raise SystemExit("Like, Pass and Super Like controls must only render for interaction-eligible profiles")
          if "refreshFirstMessageTicketState = appendDiscoverFirstMessageComposer" not in html:
              raise SystemExit("First-message ticket must be gated by interaction eligibility")
          print("Verified unassigned profiles are view-only in Discover")


      - name: Prepare isolated Discover schema and synthetic fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/server_matchmaking_eligibility_setup.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -c "ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS nearby_current_city text, ADD COLUMN IF NOT EXISTS nearby_current_state text"
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1  -f supabase/migrations/20261103165000_nearby_profiles_secure_for_all_users.sql

      - name: Apply eligibility and general-dating migrations to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116130000_server_matchmaking_eligibility_gate.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116150000_general_dating_optional_roles.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116160000_mutual_discovery_preference_eligibility.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116170000_member_dating_interests_lifestyle.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116180000_interest_match_scores.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116190000_adult_age_enforcement.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116200000_member_profile_extras.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116210000_secure_chat_typing_broadcasts.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261116220000_dating_compatibility_scores.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117190000_chat_replies_and_reactions.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117210000_restrict_chat_reply_trigger_rpc.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117220000_restrict_swipe_history_trigger_rpc.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117193000_reciprocal_partner_preferences.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117203000_lifestyle_compatibility_scoring.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117230000_scope_discover_boost_visibility.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117190000_profile_pause_discovery_control.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261118130000_profile_discover_visibility_and_pronouns.sql
      - name: Run moderation, block, completeness, and preference assertions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/server_matchmaking_eligibility.sql
      - name: Verify Pause Profile database enforcement
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/profile_pause_discovery.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/profile_discover_visibility_pronouns.sql

      - name: Apply strict dating community separation migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261118100000_strict_dating_community_separation.sql

      - name: Revoke direct access to private dating community helper
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261118110000_keep_dating_community_private.sql

      - name: Apply admin community readiness diagnostics
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261118140000_admin_community_readiness_diagnostics.sql

      - name: Test protected admin community readiness diagnostics
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/admin_community_readiness_diagnostics.sql

      - name: Apply shared-detail and interaction community guards
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261118120000_shared_dating_details_strict_community_guard.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261118121000_enforce_community_for_passes_and_story_views.sql
          psql -h localhost -U postgres -d match_test -At -F '|' -v ON_ERROR_STOP=1 -c "SELECT pg_get_functiondef('public.get_shared_dating_details(uuid[])'::regprocedure) LIKE '%member_dating_community(candidate.id)%' AS shared_details_community_guard, EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='enforce_same_dating_community_on_pass' AND NOT tgisinternal) AS pass_community_trigger, (to_regclass('public.story_views') IS NULL OR EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='story_views' AND policyname='Members can record their own story views' AND with_check LIKE '%can_view_story_from_owner%')) AS story_view_audience_guard" | grep -Fx 't|t|t'

      - name: Apply orientation-derived dating lane migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261124120000_preference_based_separated_dating_lanes.sql

      - name: Test orientation-derived dating lane separation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/server_dating_community_separation.sql

      - name: Prepare event schema and apply orientation-lane event migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.notifications (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL, type text NOT NULL, title text, body text, related_user_id uuid, is_read boolean NOT NULL DEFAULT false, action_url text, action_label text)"
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261102090000_match_events.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090000_match_event_privacy.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261103100000_match_event_private_venues.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.match_event_poster_assets (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), event_id uuid NOT NULL, organiser_id uuid NOT NULL)"
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.match_event_ticket_types (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), event_id uuid NOT NULL, is_active boolean NOT NULL DEFAULT true)"
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119210000_notify_members_when_event_is_published.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125130000_fair_discover_rotation_and_orientation_lane_events.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125160000_show_unassigned_discover_profiles_read_only.sql
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125170000_restrict_new_chats_to_assigned_dating_lane.sql
      - name: Test fair Discover candidate rotation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/tests/discover_fair_rotation.sql

      - name: Test unassigned-member chat interaction guard
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/tests/unassigned_member_interaction_guards.sql

      - name: Test orientation-derived event creation, notifications, and RLS isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 -f supabase/tests/orientation_lane_events.sql

      - name: Apply registration identity immutability guard
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261124170000_lock_registration_identity_answers.sql

      - name: Test registration identity immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/registration_identity_immutability.sql

      - name: Apply Nearby orientation and reciprocal-preference guard
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1  -f supabase/migrations/20261124150000_nearby_orientation_lane_preference_guard.sql

      - name: Test Nearby dating-lane separation, reciprocal preferences, and 50 km limit
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d match_test -v ON_ERROR_STOP=1  -f supabase/tests/nearby_dating_lane_separation.sql